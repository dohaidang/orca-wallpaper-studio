<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallpaper Studio</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main>
    <section class="pick">
      <label class="button primary" for="file" data-i18n="pick"></label>
      <input id="file" type="file" accept=".jpg,.jpeg,.png,.webp,.bmp,.gif,.mp4,.m4v,.mov,.webm,.mkv,.avi,image/*,video/*" hidden>
      <p id="source" class="muted"></p>
    </section>

    <section id="editor-box" hidden>
      <div class="frame">
        <canvas id="editor" data-i18n-aria="editor_aria"></canvas>
      </div>
      <p class="muted small hint" data-i18n="crop_hint"></p>

      <div id="scrub-box" class="scrub" hidden>
        <div class="row">
          <button id="play" type="button" class="play" data-i18n="play"></button>
          <label class="grow"><span data-i18n="scrub"></span> <output id="scrub-time"></output><input id="scrub" type="range" min="0" max="1" step="0.1" value="0"></label>
        </div>
        <div class="trim">
          <span data-i18n="trim"></span> <output id="trim-label"></output>
          <div class="dual">
            <input id="trim-start" type="range" min="0" max="1" step="0.1" value="0" data-i18n-aria="set_start">
            <input id="trim-end" type="range" min="0" max="1" step="0.1" value="1" data-i18n-aria="set_end">
          </div>
        </div>
        <div class="row" id="video-range" hidden>
          <label class="inline"><span data-i18n="video_range"></span> <input id="start-s" type="number" min="0" step="0.5" value="0"></label>
          <label class="inline"><span data-i18n="video_to"></span> <input id="end-s" type="number" min="-1" step="0.5" value="-1" data-i18n-title="video_to_title"></label>
        </div>
        <div class="row">
          <button id="set-start" type="button" data-i18n="set_start"></button>
          <button id="set-end" type="button" data-i18n="set_end"></button>
        </div>
      </div>

      <details open>
        <summary data-i18n="legend_crop"></summary>
        <div class="body">
          <select id="aspect" data-i18n-aria="aspect_aria"></select>
          <div class="tools">
            <button data-action="rotate-left" data-i18n-title="rotate_left">⟲</button>
            <button data-action="rotate-right" data-i18n-title="rotate_right">⟳</button>
            <button data-action="flip-h" data-i18n-title="flip_h">⇋</button>
            <button data-action="flip-v" data-i18n-title="flip_v">⇵</button>
            <button data-action="reset" data-i18n="reset"></button>
          </div>
        </div>
      </details>

      <details>
        <summary data-i18n="legend_adjust"></summary>
        <div class="body">
          <label><span data-i18n="brightness"></span> <output for="brightness"></output><input id="brightness" type="range" min="0.5" max="1.5" step="0.05" value="1"></label>
          <label><span data-i18n="darken"></span> <output for="darken"></output><input id="darken" type="range" min="0" max="0.8" step="0.05" value="0"></label>
          <label><span data-i18n="blur"></span> <output for="blur"></output><input id="blur" type="range" min="0" max="10" step="0.5" value="0"></label>
        </div>
      </details>

      <details>
        <summary data-i18n="legend_display"></summary>
        <div class="body">
          <label><span data-i18n="opacity"></span> <output for="opacity"></output><input id="opacity" type="range" min="0.2" max="1" step="0.05" value="1"></label>
          <div class="row">
            <label class="inline"><span data-i18n="fit"></span> <select id="size"><option>cover</option><option>contain</option><option>tile</option></select></label>
            <label class="inline"><span data-i18n="anchor"></span> <select id="position"><option>center</option><option>top</option><option>bottom</option><option>left</option><option>right</option></select></label>
          </div>
        </div>
      </details>

      <details>
        <summary data-i18n="legend_size"></summary>
        <div class="body">
          <select id="width" data-i18n-aria="width_aria"></select>
          <p id="size-note" class="muted small"></p>
        </div>
      </details>

      <details>
        <summary data-i18n="legend_anim"></summary>
        <div class="body">
          <label><span data-i18n="speed"></span> <output for="speed"></output><input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"></label>
          <div class="row">
            <label class="inline"><span data-i18n="from_frame"></span> <input id="first" type="number" min="0" value="0"></label>
            <label class="inline"><span data-i18n="to_frame"></span> <input id="last" type="number" min="-1" value="-1" data-i18n-title="to_frame_title"></label>
            <label class="inline"><span data-i18n="every"></span> <input id="step" type="number" min="1" max="4" value="1"> <span data-i18n="keep_one"></span></label>
          </div>
        </div>
      </details>

      <details open>
        <summary data-i18n="legend_apply"></summary>
        <div class="body">
          <div class="segmented" role="radiogroup">
            <label><input type="radio" name="slot" value="1" checked><span>1</span></label>
            <label><input type="radio" name="slot" value="2"><span>2</span></label>
            <label><input type="radio" name="slot" value="3"><span>3</span></label>
          </div>
          <div class="choices">
            <label><input type="radio" name="mode" value="stock" checked> <span data-i18n="mode_stock"></span></label>
            <label><input type="radio" name="mode" value="video"> <span data-i18n="mode_video"></span></label>
            <label><input type="radio" name="mode" value="patched"> <span data-i18n="mode_patched"></span></label>
          </div>
        </div>
      </details>

      <p class="muted small" id="preview-note"></p>
      <div class="frame small-frame"><canvas id="preview" width="320" height="180" data-i18n-aria="preview_aria"></canvas></div>
    </section>
  </main>

  <footer id="dock">
    <div id="progress" hidden><div id="bar"></div></div>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="actions">
      <button id="apply" class="button primary" data-i18n="apply"></button>
      <button id="cancel" class="button" data-i18n="cancel" hidden></button>
    </div>
  </footer>
  <script src="i18n.js"></script>
  <script src="panel.js"></script>
</body>
</html>
